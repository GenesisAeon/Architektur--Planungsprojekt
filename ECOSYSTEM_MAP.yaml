# Kein Trylayer-Eintrag (keine Entscheidung, keine Idee) — reine
# Bestandsaufnahme/Registry-Daten, abgeleitet aus der v1.0.0-Sprint-Roadmap
# (siehe STATUS.md, "Was noch offen ist": Repository-Kartierung).
# Quelle: Unified-Mandala-Oekosystem (Regel 9 — Quelle, nicht Ziel). Diese
# Datei wird nicht von scripts/validate_trylayer.py geprueft.
#
# tier: T0-T16 = Release-Reihenfolge laut Dependency-Graph (T0 zuerst).
#       "released" = bereits vor T0 freigegeben (entropy-table,
#       implosive-genesis); "n/a" = genesis-os, der Orchestrator selbst.
# depends_on: GenesisAeon-interne Paketnamen (ohne Versionsfloor), aus
#       "DEPENDENCY PINS TO UPDATE" der Roadmap.
# diamond: ob das Paket das Diamond-Interface implementiert
#       (run_cycle, get_crep_state, get_utac_state, get_phase_events,
#       to_zenodo_record) — relevant fuer einen spaeteren Genesis-Blindtest.

