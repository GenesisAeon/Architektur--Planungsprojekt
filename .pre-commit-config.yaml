repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: validate-trylayer
        name: Validate Trylayer entries
        entry: python scripts/validate_trylayer.py
        language: system
        pass_filenames: false
        always_run: true
